[project]
name = "todo-ai"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=10.2.3",
    "fastapi[standard]>=0.162.5",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "qdrant-client[fastembed]>=1.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py314"
src = ["backend"]
line-length = 88
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    "venv",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "DJ",
    "UP",
]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"backend/core/settings/__init__.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["backend"]
combine-as-imports = true

[tool.fastapi]
entrypoint = "backend.main:app"
